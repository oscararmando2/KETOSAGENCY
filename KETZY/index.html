<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KETZY — Learn and Play</title>
  <meta name="description" content="Interactive bilingual mini-game for children to learn vocabulary and the butterfly life cycle." />
  <!-- Prevent indexing — this page is intentionally hidden from navigation -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background floating decorations (JS-populated) -->
  <div class="bg-decorations" aria-hidden="true"></div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Sparkle burst container -->
  <div id="sparkle-container" class="sparkle-container" aria-hidden="true"></div>

  <!-- Mute / Unmute button -->
  <button
    id="mute-btn"
    title="Mute"
    aria-label="Toggle sound"
    aria-pressed="false"
  >🔊</button>

  <!-- Home / back-to-menu button -->
  <button
    id="home-btn"
    class="hidden"
    title="Back to menu"
    aria-label="Back to main menu"
  >🏠</button>

  <!-- ══ SELECTION SCREEN ══ -->
  <div id="selection-view">
    <div class="selection-container">
      <header class="game-header">
        <h1>🎓 KETZY Studies</h1>
        <p class="subtitle">Choose your lesson! / ¡Elige tu lección!</p>
      </header>

      <div class="selection-grid" role="list">

        <button class="selection-card" id="btn-butterfly" role="listitem" aria-label="Butterfly Life Cycle">
          <span class="sel-card-emoji" aria-hidden="true">🦋</span>
          <span class="sel-card-title">Butterfly<br>Life Cycle</span>
          <span class="sel-card-sub">Ciclo de vida · 4 stages</span>
        </button>

        <button class="selection-card sel-card-words" id="btn-words" role="listitem" aria-label="Words Spelling">
          <span class="sel-card-emoji" aria-hidden="true">📝</span>
          <span class="sel-card-title">Words<br>Spelling</span>
          <span class="sel-card-sub">Vocabulario · 50 words</span>
        </button>

        <a class="selection-card" id="btn-ingles-v9-v10" role="listitem" href="ingles-v9-v10.html" aria-label="Ingles V. 9 y 10" style="text-decoration:none;color:inherit;">
          <span class="sel-card-emoji" aria-hidden="true">🎮</span>
          <span class="sel-card-title">INGLES<br>V. 9 Y 10</span>
          <span class="sel-card-sub">Unidades 9 y 10 · 49 words</span>
        </a>

      </div>
    </div>
  </div><!-- /#selection-view -->

  <!-- ══ WORDS SPELLING APP ══ -->
  <div id="words-app" class="hidden">
    <!-- JS renders content here -->
  </div><!-- /#words-app -->

  <!-- ══ BUTTERFLY GAME APP ══ -->
  <div id="app" class="hidden">

    <!-- Header -->
    <header class="game-header">
      <h1>🦋 Butterfly Life Cycle</h1>
      <p class="subtitle">Learn and play / Aprende y juega</p>
    </header>

    <!-- Progress tracker -->
    <nav id="progress-bar" class="progress-bar" aria-label="Stage progress"></nav>

    <!-- Stage view (JS-rendered) -->
    <section id="stage-view"></section>

    <!-- Final celebration view (JS-rendered) -->
    <section id="final-view" class="hidden"></section>

  </div><!-- /#app -->

  <script src="script.js"></script>
</body>
</html>
