<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>DO or DOES Blox — KETZY</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky1:#3aa0ff; --sky2:#7cc6ff; --grass:#2fbf4e; --grass-d:#26a043;
    --robored:#e2231a; --yellow:#ffd23f; --purple:#8b5cf6; --ink:#22304a; --shadow:rgba(20,30,60,.30);
    --doblue:#2b7fe0; --doespurple:#7c3aed;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%,var(--grass) 58%,var(--grass-d) 100%);
    background-attachment:fixed;min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;position:relative;}
  .blocks{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .blk{position:absolute;border-radius:10px;opacity:.5;animation:float 7s ease-in-out infinite;}
  .blk::after{content:"";position:absolute;inset:0;border-radius:10px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 55%);}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(8deg)}}

  .wrap{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column;}
  .hidden{display:none !important;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border-radius:16px;padding:8px 14px;font-weight:700;font-size:1.05rem;color:var(--ink);box-shadow:0 5px 0 var(--shadow);border:3px solid #eaf2ff;}
  .pill .ico{font-size:1.2rem;}
  .icon-btn{width:52px;height:52px;border:none;border-radius:16px;background:#fff;font-size:1.5rem;box-shadow:0 5px 0 var(--shadow);cursor:pointer;flex:none;}
  .icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow);}

  .logo{font-family:'Luckiest Guy',cursive;text-align:center;line-height:.95;margin:6px 0 2px;}
  .logo .l1{display:block;font-size:clamp(2rem,8.5vw,3.6rem);color:#fff;text-shadow:0 5px 0 var(--robored),0 8px 0 rgba(0,0,0,.18);letter-spacing:2px;transform:rotate(-2deg);}
  .logo .l2{display:inline-block;font-size:clamp(1.4rem,5.5vw,2.2rem);color:var(--yellow);background:var(--robored);padding:4px 18px;border-radius:14px;transform:rotate(1deg);box-shadow:0 6px 0 rgba(0,0,0,.2);margin-top:6px;letter-spacing:1px;-webkit-text-stroke:1px rgba(0,0,0,.15);}
  .tagline{text-align:center;color:#fff;font-weight:600;font-size:1.02rem;margin:12px 0 4px;text-shadow:0 2px 4px rgba(0,0,0,.25);}

  .noob{width:104px;height:150px;position:relative;margin:6px auto 4px;transition:transform .18s;}
  .noob .head{position:absolute;top:0;left:26px;width:52px;height:48px;background:var(--yellow);border-radius:9px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);}
  .noob .eye{position:absolute;top:18px;width:8px;height:14px;background:#2a2a2a;border-radius:4px;}
  .noob .eye.l{left:13px;} .noob .eye.r{right:13px;}
  .noob .smile{position:absolute;bottom:9px;left:14px;width:24px;height:12px;border:3px solid #2a2a2a;border-top:none;border-radius:0 0 16px 16px;}
  .noob .torso{position:absolute;top:50px;left:22px;width:60px;height:48px;background:#12a9e0;border-radius:8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);}
  .noob .arm{position:absolute;top:52px;width:18px;height:44px;background:var(--yellow);border-radius:7px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08);transition:transform .2s;transform-origin:top center;}
  .noob .arm.l{left:4px;} .noob .arm.r{right:4px;}
  .noob .leg{position:absolute;top:98px;width:26px;height:48px;background:#2fbf4e;border-radius:7px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.1);}
  .noob .leg.l{left:24px;} .noob .leg.r{right:24px;}
  .noob.happy{animation:jump .5s ease;} .noob.happy .arm{transform:rotate(160deg);}
  .noob.sad{animation:wob .5s ease;}
  @keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-34px)}60%{transform:translateY(0)}}
  @keyframes wob{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-4deg)}75%{transform:translateX(9px) rotate(4deg)}}

  .panel{background:rgba(255,255,255,.92);border-radius:24px;padding:18px 16px 22px;margin-top:12px;box-shadow:0 10px 0 var(--shadow);border:4px solid #fff;}
  .panel h2{text-align:center;font-size:1.3rem;color:var(--ink);margin-bottom:12px;}

  /* ===== regla (mini tabla DO/DOES) ===== */
  .rule{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px;}
  .rule .col{border-radius:18px;padding:12px 8px 14px;color:#fff;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.22);}
  .rule .col.do{background:linear-gradient(180deg,#4aa8ff,#2b7fe0);}
  .rule .col.does{background:linear-gradient(180deg,#a78bfa,#7c3aed);}
  .rule .col b{display:block;font-family:'Luckiest Guy';font-size:2rem;letter-spacing:2px;line-height:1;}
  .rule .col .who{display:block;font-weight:700;font-size:1.05rem;margin-top:8px;line-height:1.35;}
  .rule .col .tip{display:block;font-size:.78rem;opacity:.95;margin-top:6px;font-weight:600;}
  .rule .col .who i{font-style:normal;display:inline-block;background:rgba(255,255,255,.22);border-radius:8px;padding:1px 7px;margin:2px 2px;}
  .rule .col .who i.hi{background:#ffd23f;color:#5b3d00;transform:scale(1.12);box-shadow:0 2px 0 rgba(0,0,0,.2);}

  .rule-toggle{width:100%;margin-top:12px;border:none;cursor:pointer;border-radius:14px;padding:11px;font-family:'Fredoka';font-weight:700;font-size:.98rem;color:#5b3d00;background:linear-gradient(180deg,#ffe08a,#ffca3a);box-shadow:0 5px 0 #d9a400;}
  .rule-toggle:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a400;}

  /* ===== mapa de niveles ===== */
  .worldband{display:flex;align-items:center;gap:10px;margin:20px 0 10px;background:rgba(255,255,255,.9);border-radius:18px;padding:10px 14px;box-shadow:0 6px 0 var(--shadow);}
  .worldband .we{font-size:1.9rem;flex:none;}
  .worldband .wt{flex:1;line-height:1.15;}
  .worldband .wt b{display:block;font-family:'Luckiest Guy';font-size:1.15rem;color:var(--ink);letter-spacing:.5px;}
  .worldband .wt span{font-size:.82rem;color:#5b6b86;font-weight:600;}
  .worldband .wl{border:none;cursor:pointer;border-radius:12px;padding:9px 12px;font-family:'Fredoka';font-weight:700;font-size:.85rem;color:#fff;background:linear-gradient(180deg,#8b5cf6,#6d3fd6);box-shadow:0 4px 0 #532bb0;flex:none;}
  .worldband .wl:active{transform:translateY(3px);box-shadow:0 1px 0 #532bb0;}

  .lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  @media(max-width:420px){.lvgrid{gap:8px;}}
  .lv{position:relative;border:none;cursor:pointer;border-radius:16px;padding:12px 2px 16px;font-family:'Luckiest Guy';font-size:1.45rem;color:#fff;background:linear-gradient(180deg,#4aa8ff,#2b7fe0);box-shadow:0 5px 0 #1f66bd;transition:transform .08s;}
  .lv:active{transform:translateY(4px);box-shadow:0 1px 0 #1f66bd;}
  .lv.done{background:linear-gradient(180deg,#3ddc6d,#22a03f);box-shadow:0 5px 0 #178030;}
  .lv.boss{background:linear-gradient(180deg,#ff8a3d,#e2231a);box-shadow:0 5px 0 #b01109;}
  .lv.boss.done{background:linear-gradient(180deg,#ffd23f,#f0a500);box-shadow:0 5px 0 #c78500;color:#5b3d00;}
  .lv.lock{background:linear-gradient(180deg,#c3cddd,#9aa7bd);box-shadow:0 5px 0 #7c8799;color:#eef3fb;cursor:default;}
  .lv .st{position:absolute;bottom:3px;left:0;right:0;font-size:.55rem;letter-spacing:-1px;font-family:'Fredoka';}
  .lv .crown{position:absolute;top:-8px;right:-4px;font-size:1rem;}

  /* ===== lección de mundo ===== */
  .lesson h2{font-family:'Luckiest Guy';font-size:1.5rem;color:var(--robored);text-align:center;line-height:1.1;}
  .lesson .lex{background:#eef4ff;border-radius:16px;padding:12px 14px;margin-top:12px;}
  .lesson .lex .en{font-family:'Luckiest Guy';font-size:1.35rem;color:var(--ink);line-height:1.25;}
  .lesson .lex .en u{text-decoration:none;color:var(--doblue);}
  .lesson .lex .en u.p{color:var(--doespurple);}
  .lesson .lex .es{font-size:.92rem;color:#5b6b86;font-weight:600;margin-top:3px;}
  .lesson .bad{background:#ffe7e4;}
  .lesson .bad .en{color:#b01109;text-decoration:line-through;text-decoration-thickness:3px;}
  .lesson .note{text-align:center;font-weight:700;color:#5b6b86;margin-top:14px;font-size:.98rem;line-height:1.4;}
  .lesson .note em{font-style:normal;color:var(--robored);}

  /* ===== juego ===== */
  .progress{height:16px;background:rgba(255,255,255,.55);border-radius:10px;overflow:hidden;margin:6px 0 14px;border:2px solid #fff;}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:10px;transition:width .3s;}
  .qcard{background:#fff;border-radius:26px;padding:18px 16px 22px;text-align:center;box-shadow:0 10px 0 var(--shadow);border:5px solid #fff;}
  .tag{display:inline-block;background:#eef4ff;color:#2b7fe0;font-weight:700;border-radius:12px;padding:5px 14px;font-size:.88rem;margin-bottom:10px;}
  .hearts{float:right;font-size:.95rem;letter-spacing:1px;}
  .sentence{font-family:'Luckiest Guy';font-size:clamp(1.7rem,7.4vw,2.6rem);color:var(--ink);line-height:1.25;margin:6px 0 4px;word-spacing:2px;}
  .sentence .blank{display:inline-block;min-width:2.6em;border-bottom:5px solid var(--robored);color:transparent;}
  .sentence b{color:var(--robored);font-weight:400;}
  .sentence .ok{color:#22a03f;}
  .sentence .em{font-size:1.1em;}
  .trans{font-size:1rem;color:#5b6b86;font-weight:600;margin-bottom:6px;}
  .qhelp{font-size:.9rem;color:#8b5cf6;font-weight:700;margin-bottom:4px;}

  .opts{display:grid;gap:12px;margin-top:16px;}
  .opts.two{grid-template-columns:1fr 1fr;}
  .opts.one{grid-template-columns:1fr;}
  .opt{border:none;cursor:pointer;border-radius:20px;padding:20px 8px;font-family:'Luckiest Guy';font-size:1.75rem;color:#fff;background:linear-gradient(180deg,#4aa8ff,#2b7fe0);box-shadow:0 7px 0 #1f66bd;transition:transform .08s,box-shadow .08s;min-height:78px;letter-spacing:1px;}
  .opts.one .opt{font-size:1.3rem;padding:18px 10px;min-height:0;line-height:1.2;}
  .opt:nth-child(2){background:linear-gradient(180deg,#a78bfa,#7c3aed);box-shadow:0 7px 0 #5b21b6;}
  .opt:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .opt.correct{background:linear-gradient(180deg,#3ddc6d,#22a03f)!important;box-shadow:0 7px 0 #178030!important;animation:pop .35s;}
  .opt.wrong{background:linear-gradient(180deg,#ff6b6b,#e2231a)!important;box-shadow:0 7px 0 #b01109!important;animation:shakeb .35s;}
  .opt.dim{opacity:.4;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shakeb{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .explain{margin-top:14px;border-radius:18px;padding:14px;text-align:left;animation:pop .3s;}
  .explain.good{background:#d6f7e0;border:3px solid #3ddc6d;}
  .explain.bad{background:#ffe7e4;border:3px solid #ff8a80;}
  .explain .eh{font-family:'Luckiest Guy';font-size:1.25rem;margin-bottom:6px;}
  .explain.good .eh{color:#178030;} .explain.bad .eh{color:#b01109;}
  .explain .why{font-weight:700;color:var(--ink);font-size:1rem;line-height:1.4;}
  .explain .fix{margin-top:9px;background:#fff;border-radius:12px;padding:9px 12px;font-family:'Luckiest Guy';font-size:1.25rem;color:#22a03f;}
  .explain .fix small{display:block;font-family:'Fredoka';font-size:.82rem;color:#5b6b86;font-weight:600;letter-spacing:0;}
  .explain .sayb{margin-top:10px;border:none;cursor:pointer;border-radius:12px;padding:9px 14px;font-family:'Fredoka';font-weight:700;font-size:.92rem;color:#fff;background:linear-gradient(180deg,#8b5cf6,#6d3fd6);box-shadow:0 4px 0 #532bb0;}
  .nextb{width:100%;margin-top:12px;border:none;cursor:pointer;border-radius:18px;padding:16px;font-family:'Luckiest Guy';font-size:1.35rem;color:#fff;background:linear-gradient(180deg,#2fbf4e,#22a03f);box-shadow:0 6px 0 #178030;letter-spacing:1px;}
  .nextb:active{transform:translateY(4px);box-shadow:0 2px 0 #178030;}

  .floatpt{position:fixed;z-index:50;font-family:'Luckiest Guy';font-size:2rem;color:#ffd23f;text-shadow:0 2px 0 #c78500;pointer-events:none;animation:rise 1s ease forwards;}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}

  .end-panel{background:rgba(255,255,255,.94);border-radius:26px;padding:26px 20px 30px;text-align:center;box-shadow:0 12px 0 var(--shadow);border:5px solid #fff;margin-top:16px;}
  .end-panel h2{font-family:'Luckiest Guy';font-size:2rem;color:var(--robored);line-height:1.1;}
  .stars-row{font-size:3rem;margin:10px 0 4px;letter-spacing:6px;}
  .star{display:inline-block;filter:grayscale(1) opacity(.35);transform:scale(.85);}
  .star.on{filter:none;animation:pop .5s;}
  .end-score{font-size:1.2rem;font-weight:700;margin:8px 0;} .end-coins{font-size:1.3rem;font-weight:700;color:#c78500;margin-bottom:14px;}
  .missed{background:#fff6f5;border-radius:16px;padding:12px;text-align:left;margin-bottom:14px;border:3px solid #ffd5d0;}
  .missed b{display:block;color:#b01109;font-size:.95rem;margin-bottom:6px;}
  .missed p{font-family:'Luckiest Guy';font-size:1.05rem;color:#22a03f;line-height:1.5;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .cta{border:none;cursor:pointer;border-radius:18px;padding:15px 20px;font-family:'Fredoka';font-weight:700;font-size:1.05rem;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s;}
  .cta:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .cta.play{background:linear-gradient(180deg,#2fbf4e,#22a03f);} .cta.other{background:linear-gradient(180deg,#8b5cf6,#6d3fd6);} .cta.menu{background:linear-gradient(180deg,#3aa0ff,#2b7fe0);}

  #confetti{position:fixed;inset:0;z-index:40;pointer-events:none;}
  .credit{text-align:center;color:#fff;opacity:.85;font-size:.8rem;margin-top:auto;padding-top:16px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.3);}

  .premio{margin-top:12px;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#00c06a,#00915a);box-shadow:0 8px 0 rgba(0,0,0,.2);color:#fff;}
  .premio .gift{font-size:2.2rem;flex:none;}
  .premio .ptxt{flex:1;} .premio .ptxt b{display:block;font-size:1.05rem;}
  .premio .ptxt span{font-size:.85rem;opacity:.95;}
  .premio .pbar{display:block;height:9px;background:rgba(255,255,255,.35);border-radius:6px;margin-top:7px;overflow:hidden;}
  .premio .pbar i{display:block;height:100%;background:#ffd23f;border-radius:6px;}
  .premio.done{background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#5b3d00;}

  .reward-ov{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;}
  .reward-card{background:#fff;border-radius:28px;padding:24px 20px 26px;max-width:420px;width:100%;text-align:center;box-shadow:0 16px 0 rgba(0,0,0,.3);animation:pop .5s;}
  .reward-card h2{font-family:'Luckiest Guy';font-size:1.8rem;color:var(--robored);line-height:1.05;}
  .reward-card p{font-weight:600;color:var(--ink);margin:8px 0;font-size:1.02rem;}
  .reward-note{font-size:.95rem;color:#00915a;font-weight:700;}
  .robux-card{background:linear-gradient(140deg,#00c06a,#00794b);border-radius:18px;padding:20px;margin:14px 0;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25);position:relative;overflow:hidden;}
  .robux-card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 45%);}
  .rb-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}
  .rb-logo{font-family:'Luckiest Guy';font-size:1.7rem;letter-spacing:1px;}
  .rb-gem{font-size:1.6rem;}
  .rb-mid{position:relative;z-index:2;text-align:left;margin-top:24px;font-size:.8rem;letter-spacing:2px;opacity:.9;}
  .rb-amt{position:relative;z-index:2;text-align:left;font-family:'Luckiest Guy';font-size:1.5rem;margin-top:2px;}
  .reward-burst{font-size:2.6rem;}
  .medal-big{font-size:4rem;line-height:1;}
</style>
</head>
<body>
  <div class="blocks" id="blocks" aria-hidden="true"></div>
  <canvas id="confetti"></canvas>

  <div class="wrap">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" title="Atrás">🔙</button>
      <span class="pill"><span class="ico">🪙</span><span id="coinCount">0</span></span>
      <span class="pill hidden" id="streakPill"><span class="ico">🔥</span><span id="streakCount">0</span></span>
      <button class="icon-btn" id="muteBtn" title="Sonido">🔊</button>
    </div>

    <!-- ===== MAPA ===== -->
    <section id="map">
      <div class="logo"><span class="l1">DO or DOES</span><span class="l2">BLOX</span></div>
      <p class="tagline">50 niveles para que nunca más te equivoques 💪</p>
      <div class="premio" id="premioBanner"></div>
      <div class="panel">
        <h2>📖 LA REGLA DE ORO</h2>
        <div class="rule">
          <div class="col do"><b>DO</b><span class="who"><i>I</i><i>You</i><i>We</i><i>They</i></span><span class="tip">yo · tú · nosotros · ellos<br>(y MUCHOS: my friends)</span></div>
          <div class="col does"><b>DOES</b><span class="who"><i>He</i><i>She</i><i>It</i></span><span class="tip">él · ella · eso<br>(y UNO SOLO: my mom)</span></div>
        </div>
        <button class="rule-toggle" id="ruleSay">🔊 Escuchar la regla</button>
      </div>
      <div class="panel" id="lvPanel"></div>
      <p class="credit">Hecho con 💜 para ti · KETZY</p>
    </section>

    <!-- ===== LECCIÓN ===== -->
    <section id="lesson" class="hidden">
      <div class="panel lesson" id="lessonBox"></div>
    </section>

    <!-- ===== JUEGO ===== -->
    <section id="game" class="hidden">
      <div class="progress"><i id="progFill"></i></div>
      <div class="qcard">
        <span class="hearts" id="hearts"></span>
        <span class="tag" id="levelTag">Nivel 1</span>
        <div class="qhelp hidden" id="qhelp"></div>
        <div class="sentence" id="sentence"></div>
        <div class="trans" id="trans"></div>
        <div class="opts two" id="opts"></div>
        <div id="explainBox"></div>
      </div>
      <div class="panel hidden" id="miniRule" style="padding:12px 12px 14px;margin-top:12px;">
        <div class="rule" style="margin:0;">
          <div class="col do"><b>DO</b><span class="who" id="mrDo"></span></div>
          <div class="col does"><b>DOES</b><span class="who" id="mrDoes"></span></div>
        </div>
      </div>
      <button class="rule-toggle hidden" id="peekBtn" style="max-width:820px;">🤔 ¿Se te olvidó? Ver la regla</button>
      <div class="noob" id="gameNoob" style="margin-top:10px;">
        <div class="head"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
        <div class="arm l"></div><div class="torso"></div><div class="arm r"></div>
        <div class="leg l"></div><div class="leg r"></div>
      </div>
    </section>

    <!-- ===== FIN DE NIVEL ===== -->
    <section id="end" class="hidden">
      <div class="end-panel">
        <h2 id="endTitle">¡NIVEL COMPLETO!</h2>
        <div class="stars-row" id="starsRow"><span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
        <div class="end-score" id="endScore"></div>
        <div class="end-coins" id="endCoins"></div>
        <div class="missed hidden" id="missedBox"></div>

    var a=pick(actsFor(sub)), ae=actEn(sub,a), wrong=Math.random()<0.5;
    var shown=sub.s+' '+(wrong?other(sub.f):sub.f)+' '+ae+'.';
    return {kind:'tf',sub:sub,cols:'two',
      sentence:shown, trans:cap(sub.es)+' '+hace(sub,a)+' '+a.e, help:'¿Está bien escrito? 🤔',
      opts:[{t:'✅ BIEN',ok:!wrong},{t:'❌ MAL',ok:wrong}],
      good:sub.s+' '+sub.f+' '+ae+'.', goodEs:cap(sub.es)+' '+hace(sub,a)+'.',
      why:(wrong?'Estaba MAL. ':'Estaba BIEN. ')+whyOf(sub)};
  }
  function genQ(sub){
    var v=pick(VERBS);
    return {kind:'q',sub:sub,cols:'two',
      sentence:'<span class="blank">___</span> '+sub.q+' '+v.en+'? '+v.e,
      trans:'¿'+sub.es+' '+v[sub.g]+'?', help:'Es una PREGUNTA ❓',
      opts:[{t:'DO',ok:sub.f==='do'},{t:'DOES',ok:sub.f==='does'}], fill:cap(sub.f),
      good:cap(sub.f)+' '+sub.q+' '+v.en+'?', goodEs:'¿'+cap(sub.es)+' '+v[sub.g]+'?',
      why:whyOf(sub)+'<br>En las preguntas va hasta adelante.'};
  }
  function genQfix(sub){
    var v=pick(VERBS);
    var good=cap(sub.f)+' '+sub.q+' '+v.en+'?', bad=cap(other(sub.f))+' '+sub.q+' '+v.en+'?';
    var opts=shuffle([{t:good,ok:true},{t:bad,ok:false}]);
    return {kind:'qfix',sub:sub,cols:'one', help:'Es una PREGUNTA ❓',
      sentence:'¿Qué pregunta está BIEN? '+v.e, trans:'¿'+sub.es+' '+v[sub.g]+'?',
      opts:opts, good:good, goodEs:'¿'+cap(sub.es)+' '+v[sub.g]+'?', why:whyOf(sub)};
  }
  function genNeg(sub){
    var v=pick(VERBS);
    return {kind:'neg',sub:sub,cols:'two',
      sentence:'<b>'+sub.s+'</b> <span class="blank">___</span> '+v.en+'. '+v.e,
      trans:cap(sub.es)+' NO '+v[sub.g], help:'Es NEGATIVO 🚫',
      opts:[{t:'don’t',ok:sub.f==='do'},{t:'doesn’t',ok:sub.f==='does'}], fill:neg(sub.f),
      good:sub.s+' '+neg(sub.f)+' '+v.en+'.', goodEs:cap(sub.es)+' NO '+v[sub.g]+'.',
      why:whyOf(sub)+'<br>'+(sub.f==='do'?'do + not = <b>don’t</b>':'does + not = <b>doesn’t</b>')};
  }
  function genNegfix(sub){
    var v=pick(VERBS);
    var good=sub.s+' '+neg(sub.f)+' '+v.en+'.', bad=sub.s+' '+neg(other(sub.f))+' '+v.en+'.';
    var opts=shuffle([{t:good,ok:true},{t:bad,ok:false}]);
    return {kind:'negfix',sub:sub,cols:'one', help:'Es NEGATIVO 🚫',
      sentence:'¿Cuál está BIEN? '+v.e, trans:cap(sub.es)+' NO '+v[sub.g],
      opts:opts, good:good, goodEs:cap(sub.es)+' NO '+v[sub.g]+'.', why:whyOf(sub)};
  }
  var GEN={choose:genChoose,fix:genFix,tf:genTF,q:genQ,qfix:genQfix,neg:genNeg,negfix:genNegfix};

  function buildQuestions(cfg){
    var subs=poolOf(cfg.p);
    var dos=subs.filter(function(s){return s.f==='do';}), doeses=subs.filter(function(s){return s.f==='does';});
    var types=[]; while(types.length<cfg.n){ types=types.concat(shuffle(cfg.t.slice())); } types=types.slice(0,cfg.n);
    var out=[],lastSub='';
    for(var i=0;i<cfg.n;i++){
      var want=(i%2===0)?'do':'does';
      var bag=(want==='do'?dos:doeses); if(!bag.length) bag=subs;
      var sub=pick(bag), guard=0;
      while(sub.s===lastSub && bag.length>1 && guard++<8){ sub=pick(bag); }
      lastSub=sub.s;
      var q=(types[i]==='subject')?genSubject(sub,subs):GEN[types[i]](sub);
      out.push(q);
    }
    return shuffle(out);
  }

  /* ---------- MAPA ---------- */
  function starsOf(n){ return save.stars[String(n)]||0; }
  function doneCount(){ var c=0; for(var i=1;i<=50;i++){ if(starsOf(i)>0) c++; } return c; }
  function renderPremio(){
    var b=$('premioBanner'), d=doneCount(), pct=Math.round(d/50*100);
    if(save.robux){
      b.className='premio done';
      b.innerHTML='<span class="gift">🎁</span><div class="ptxt"><b>¡Ganaste tu Tarjeta de Robux! 💚</b><span>Enséñasela a tus papás para reclamarla</span></div>';
    }else{
      b.className='premio';
      b.innerHTML='<span class="gift">🎁</span><div class="ptxt"><b>Premio: Tarjeta de Robux</b><span>Termina los 50 niveles · llevas '+d+'/50</span><span class="pbar"><i style="width:'+pct+'%"></i></span></div>';
    }
  }
  function buildMap(){
    renderPremio();
    var html='<h2>🗺️ MAPA · 50 NIVELES</h2>';
    for(var w=0;w<WORLDS.length;w++){
      var W=WORLDS[w];
      html+='<div class="worldband"><span class="we">'+W.e+'</span><div class="wt"><b>'+W.n+'</b><span>'+W.s+'</span></div><button class="wl" data-lesson="'+w+'">📖 Lección</button></div>';
      html+='<div class="lvgrid">';
      for(var n=W.from;n<=W.to;n++){
        var st=starsOf(n), locked=n>save.max, boss=isBoss(n);
        var cls='lv'+(locked?' lock':(st>0?' done':''))+(boss?' boss':'');
        html+='<button class="'+cls+'" data-lv="'+n+'"'+(locked?' disabled':'')+'>'+
              (boss&&!locked?'<span class="crown">👑</span>':'')+
              (locked?'🔒':n)+
              '<span class="st">'+(st>0?'⭐'.repeat(st):'')+'</span></button>';
      }
      html+='</div>';
    }
    var p=$('lvPanel'); p.innerHTML=html;
    Array.prototype.forEach.call(p.querySelectorAll('.lv'),function(b){
      if(b.disabled) return;
      b.addEventListener('click',function(){ unlockAudio(); startLevel(parseInt(b.getAttribute('data-lv'),10)); });
    });
    Array.prototype.forEach.call(p.querySelectorAll('.wl'),function(b){
      b.addEventListener('click',function(){ unlockAudio(); openLesson(parseInt(b.getAttribute('data-lesson'),10),null); });
    });
  }

  /* ---------- LECCIÓN ---------- */
  var lessonNext=null;
  function openLesson(wi,thenLevel){
    var L2=LESSONS[wi]; lessonNext=thenLevel;
    var html='<h2>'+L2.t+'</h2>';
    if(L2.rule){
      html+='<div class="rule" style="margin-top:12px;">'+
        '<div class="col do"><b>DO</b><span class="who"><i>I</i><i>You</i><i>We</i><i>They</i></span></div>'+
        '<div class="col does"><b>DOES</b><span class="who"><i>He</i><i>She</i><i>It</i></span></div></div>';
    }
    L2.ex.forEach(function(x){ html+='<div class="lex"><div class="en">'+x.en+'</div><div class="es">'+x.es+'</div></div>'; });
    (L2.bad||[]).forEach(function(x){ html+='<div class="lex bad"><div class="en">'+x.en+'</div></div><div class="lex" style="background:#fff6f5;margin-top:-6px;"><div class="es">'+x.es+'</div></div>'; });
    html+='<p class="note">'+L2.note+'</p>';
    html+='<button class="rule-toggle" id="lessonSay">🔊 Escuchar los ejemplos</button>';
    html+='<button class="nextb" id="lessonGo">'+(thenLevel?'✅ ¡A jugar el nivel '+thenLevel+'!':'👌 Entendido')+'</button>';
    $('lessonBox').innerHTML=html;
    $('lessonGo').addEventListener('click',function(){
      try{speechSynthesis.cancel();}catch(e){}
      if(lessonNext){ beginLevel(lessonNext); } else { show('map'); }
    });
    $('lessonSay').addEventListener('click',function(){
      var txt=L2.ex.map(function(x){ return x.en.replace(/<[^>]+>/g,''); }).join('. ');
      sayEn(txt);
    });
    show('lesson');
  }

  /* ---------- JUEGO ---------- */
  var round=null, locked=false;
  function startLevel(n){
    var cfg=LEVELS[n-1], w=cfg.w;
    if(!save.seen['w'+w] && n===WORLDS[w].from){ save.seen['w'+w]=1; persist(); openLesson(w,n); return; }
    beginLevel(n);
  }
  function beginLevel(n){
    var cfg=LEVELS[n-1];
    round={ n:n, cfg:cfg, qs:buildQuestions(cfg), i:0, correct:0, earned:0, streak:0, marks:[], missed:[] };
    $('streakCount').textContent='0';
    $('miniRule').classList.toggle('hidden',!cfg.h);
    $('peekBtn').classList.toggle('hidden',!!cfg.h);
    show('game'); loadQuestion();
  }
  function fillMiniRule(sub){
    var d=['I','You','We','They'],s=['He','She','It'];
    function chips(arr){ return arr.map(function(x){ return '<i'+(sub&&sub.s===x?' class="hi"':'')+'>'+x+'</i>'; }).join(''); }
    $('mrDo').innerHTML=chips(d); $('mrDoes').innerHTML=chips(s);
  }
  function loadQuestion(){
    locked=false;
    var q=round.qs[round.i], cfg=round.cfg;
    $('progFill').style.width=Math.round(round.i/round.cfg.n*100)+'%';
    $('levelTag').textContent='Nivel '+round.n+' · '+WORLDS[cfg.w].e+' '+(round.i+1)+'/'+cfg.n;
    $('hearts').innerHTML=round.marks.join('');
    $('sentence').innerHTML=q.sentence;
    $('trans').textContent=q.trans||'';
    var h=$('qhelp'); if(q.help){ h.textContent=q.help; h.classList.remove('hidden'); } else { h.textContent=''; h.classList.add('hidden'); }
    var o=$('opts'); o.className='opts '+(q.cols||'two'); o.innerHTML='';
    q.opts.forEach(function(op,idx){
      var b=document.createElement('button'); b.className='opt'; b.innerHTML=op.t;
      b.addEventListener('click',function(ev){ answer(op.ok,b,ev); });
      o.appendChild(b);
    });
    $('explainBox').innerHTML='';
    fillMiniRule(q.sub);
    scrollTo(0,0);
  }
  function answer(ok,btn,ev){
    if(locked) return; locked=true;
    var q=round.qs[round.i], o=$('opts');
    Array.prototype.forEach.call(o.children,function(b){ if(b!==btn) b.classList.add('dim'); });
    btn.classList.add(ok?'correct':'wrong');
    if(ok){
      round.correct++; round.streak++; round.marks.push('✅');
      var bonus=round.streak>=3?15:10; round.earned+=bonus; setCoins(save.coins+bonus);
      sndCorrect(); react(true);
      if(ev&&ev.clientX) floatPoints(ev.clientX,ev.clientY,'+'+bonus);
      $('streakCount').textContent=round.streak;
    }else{
      round.streak=0; round.marks.push('❌'); round.missed.push(q);
      sndWrong(); react(false);
      $('streakCount').textContent='0';
    }
    $('hearts').innerHTML=round.marks.join('');
    if(q.fill){ $('sentence').innerHTML=q.sentence.replace('<span class="blank">___</span>','<span class="ok">'+q.fill+'</span>'); }
    showExplain(q,ok);
  }
  function showExplain(q,ok){
    var html='<div class="explain '+(ok?'good':'bad')+'">'+
      '<div class="eh">'+(ok?pick(['¡PERFECTO! 🎉','¡ESO ES! 💪','¡MUY BIEN! ⭐','¡GENIAL! 🚀'])+'':'¡Ups! Mira bien 👀')+'</div>'+
      '<div class="why">'+q.why+'</div>'+
      '<div class="fix">'+q.good+'<small>'+(q.goodEs||'')+'</small></div>'+
      '<button class="sayb" id="sayBtn">🔊 Escuchar en inglés</button>'+
      '</div>';
    if(!ok) html+='<button class="nextb" id="nextQ">👍 ¡Ya entendí! Seguir</button>';
    $('explainBox').innerHTML=html;
    $('sayBtn').addEventListener('click',function(){ sayEn(q.good); });
    sayEn(q.good);
    if(ok){ setTimeout(nextQuestion,1500); }
    else { $('nextQ').addEventListener('click',nextQuestion); }
  }
  function nextQuestion(){
    round.i++;
    if(round.i>=round.cfg.n) finish(); else loadQuestion();
  }

  function finish(){
    try{speechSynthesis.cancel();}catch(e){}
    $('progFill').style.width='100%';
    var n=round.cfg.n, c=round.correct, s;
    if(c===n) s=3; else if(c>=n-1) s=2; else if(c>=Math.ceil(n*0.6)) s=1; else s=0;
    var prev=starsOf(round.n), newReward=null;
    if(s>prev){ save.stars[String(round.n)]=s; }
    if(s>0 && save.max===round.n && round.n<50){ save.max=round.n+1; }
    var bonus=s*20; if(bonus){ round.earned+=bonus; setCoins(save.coins+bonus); }
    persist();
    if(s>0){
      if(round.n===50 && !save.robux){ save.robux=1; persist(); newReward='robux'; }
      else if(isBoss(round.n) && prev===0){ newReward='medal'; }
    }
    $('endTitle').innerHTML = s>=3?'¡PERFECTO! 🏆' : s>0?'¡NIVEL COMPLETO! 🎉' : 'CASI… ¡OTRA VEZ! 💪';
    var sr=$('starsRow').children; for(var i=0;i<3;i++){ sr[i].className='star'+(i<s?' on':''); }
    $('endScore').textContent='Acertaste '+c+' de '+n;
    $('endCoins').textContent='🪙 +'+round.earned+' monedas';
    var mb=$('missedBox');
    if(round.missed.length){
      var h='<b>📌 Repasa estas antes de seguir:</b>';
      round.missed.slice(0,4).forEach(function(q){ h+='<p>'+q.good+'</p>'; });
      mb.innerHTML=h; mb.classList.remove('hidden');
    } else { mb.classList.add('hidden'); }
    $('nextLvBtn').classList.toggle('hidden', !(s>0 && round.n<50));
    show('end');
    if(s>=2){ sndWin(); confetti(140); } else { sndCoin(); }
    if(newReward) setTimeout(function(){ showReward(newReward); },900);
  }

  function showReward(kind){
    var html;
    if(kind==='robux'){
      html='<div class="reward-burst">🎉🎁🎉</div><h2>¡TERMINASTE<br>LOS 50 NIVELES!</h2>'+
        '<p>Ya dominas <b>DO</b> y <b>DOES</b> 🌟</p>'+
        '<div class="robux-card"><div class="rb-top"><span class="rb-logo">ROBUX</span><span class="rb-gem">💎</span></div>'+
        '<div class="rb-mid">TARJETA DE REGALO</div><div class="rb-amt">🎁 ¡Te la ganaste!</div></div>'+
        '<p class="reward-note">📱 Enséñale esta pantalla a tus papás 💚</p>'+
        '<button class="cta play" id="rewardClose" style="margin-top:6px;">¡GENIAL! 🎮</button>';
      sayEs('¡Felicidades! Terminaste los cincuenta niveles y te ganaste una tarjeta de Robux.');
    }else{
      var m=['🥉','🥈','🥇','🏅'][Math.min(3,(round.n/10|0)-1)];
      html='<div class="medal-big">'+m+'</div><h2>¡MUNDO<br>COMPLETADO!</h2>'+
        '<p>Pasaste el nivel jefe <b>'+round.n+'</b> 👑<br>Llevas <b>'+doneCount()+'/50</b> niveles.</p>'+
        '<p class="reward-note">¡Sigue así y ganas la Tarjeta de Robux! 🎁</p>'+
        '<button class="cta play" id="rewardClose" style="margin-top:6px;">¡Seguir! 🚀</button>';
      sayEs('¡Muy bien! Completaste un mundo entero.');
    }
    $('rewardCard').innerHTML=html;
    $('rewardOv').classList.remove('hidden');
    sndWin(); confetti(200);
    $('rewardClose').addEventListener('click',function(){ $('rewardOv').classList.add('hidden'); });
  }

  /* ---------- navegación ---------- */
  function show(which){
    Object.keys(scr).forEach(function(k){ scr[k].classList.add('hidden'); });
    scr[which].classList.remove('hidden');
    $('streakPill').classList.toggle('hidden',which!=='game');
    if(which==='map') buildMap();
    scrollTo(0,0);
  }
  $('backBtn').addEventListener('click',function(){
    try{speechSynthesis.cancel();}catch(e){}
    show('map');
  });
  $('toMapBtn').addEventListener('click',function(){ show('map'); });
  $('againBtn').addEventListener('click',function(){ beginLevel(round.n); });
  $('nextLvBtn').addEventListener('click',function(){ startLevel(Math.min(50,round.n+1)); });
  $('peekBtn').addEventListener('click',function(){
    var m=$('miniRule'), hid=m.classList.toggle('hidden');
    $('peekBtn').innerHTML=hid?'🤔 ¿Se te olvidó? Ver la regla':'🙈 Ocultar la regla';
  });
  $('ruleSay').addEventListener('click',function(){
    unlockAudio();
    sayEs('Escucha bien. I, you, we, they usan DO. He, she, it usan DOES.');
  });
  $('muteBtn').addEventListener('click',function(){
    muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊';
    if(muted){ try{speechSynthesis.cancel();}catch(e){} } else { unlockAudio(); sndCoin(); }
  });

  show('map');
})();
</script>
